<!doctype html>
<!--
  项目代理 Demo：锚定回复 · 代理验证 · 按需披露
  创建时间：2026-09-24
  最后更新：2026-09-24
  说明：纯前端模拟，数据与耗时都是假的。演示 ADR 80 的交互合同：
    - 每条消息被代理接住，要干活的锚定这条消息开任务（右栏）；
    - 任务的「需要你」冒泡到原消息下；插话由代理自主处置（并入 / 取代 / 并行 / 停止 / 回答）；
    - 引用某条消息再插话，只作用于那条消息对应的任务；
    - 任务结束后代理一两句话汇报，低风险且验证通过的汇报即策略代签；
    - 追问「怎么验证的」给细节，「给我看证据」给证据；对外操作走「需要你确认」。
  关联：knowledge/decisions/80-project-agent-delegation-model.md
        design/product/project-agent-workbench.md
  Tokens 遵循 design/visual/previews/workbench/CONTRACT.md（Peer Frost 八条红线）。
-->
<html lang="zh-CN">

<style>

  .detail { padding: 12px 14px 16px; }

  /* ---------- modal ---------- */

<body>

<div class="topbar">
  <div>
    <div class="kicker">Demo · ADR 80</div>
    <div class="title">项目代理：锚定回复 · 代理验证 · 按需披露</div>
  </div>
  <div class="sub">数据与耗时均为模拟；点下方建议或直接输入</div>
  <div class="spacer"></div>
  <span class="sub">速度</span>
  <div class="seg" id="speed">
    <button data-v="1" class="on">1×</button>
    <button data-v="2">2×</button>
    <button data-v="4">4×</button>
  </div>
  <button class="btn" id="reset">重置</button>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">P</span>Peer</div>
    <div class="group-title">项目</div>
    <div id="projects"></div>
    <div class="foot">每个项目一个项目代理。角标 = 需要你处理的事。</div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div class="t">Peer-Agent · 项目代理</div>
      <div class="s" id="agentStatus"></div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="composer-wrap">
      <div class="suggest" id="suggest"></div>
      <div class="composer">
        <div id="quoteSlot"></div>
        <div class="composer-row">
          <textarea id="input" rows="1" placeholder="对项目代理说点什么… Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn primary" id="send">发送</button>
        </div>
      </div>
      <div class="hint">悬停任意消息点「引用」可以指定插话针对哪件事；右栏点任务可以查看现场并直接介入。</div>
    </div>
  </main>

  <aside class="rail" id="rail"></aside>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // State
  // ------------------------------------------------------------------
  const state = {
    messages: [],
    sessions: [],
    busy: 0,
    quote: null,
    speed: 1,
    granted: false,
    selected: null,
    timers: new Set(),
    usedReleaseSuggestion: false,
  };
  let uid = 0;
  const nid = (p) => `${p}${++uid}`;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shorten = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);
  const S = (id) => state.sessions.find((x) => x.id === id);
  const M = (id) => state.messages.find((x) => x.id === id);

  function later(ms, fn, owner) {
    const id = setTimeout(() => {
      state.timers.delete(id);
      if (owner) owner.timers.delete(id);
      fn();
    }, ms / state.speed);
    state.timers.add(id);
    if (owner) owner.timers.add(id);
    return id;
  }
  function clearOwner(owner) {
    for (const id of owner.timers) { clearTimeout(id); state.timers.delete(id); }
    owner.timers.clear();
  }

  // ------------------------------------------------------------------
  // Task templates (all simulated)
  // ------------------------------------------------------------------
  const TPL = {

      files: ['UsageStatsPanel.tsx', 'usage-day.mjs', 'usage-by-day.test.ts', 'usage-panel.css'],

    }),
    generic: (text) => ({
      title: shorten(text.replace(/[，。,.!！？?]/g, ' ').trim(), 14),

    }),
    fix: (orig, text) => ({

      methods: [...orig.methods, '新增回归用例覆盖你指出的情况'],

      needsPermission: false, visual: orig.visual, outcome: 'auto', branch: orig.branch ? orig.branch + '-fix' : null,

  // ------------------------------------------------------------------
  // Sessions
  // ------------------------------------------------------------------
  function buildSteps(tpl) {
    const steps = [];
    if (tpl.inherited) {
      steps.push({ phase: 'inspect', text: '继承旧任务的报告、已读材料与面板结构', ms: 900, p: 20 });
    } else {
      steps.push({ phase: 'orient', text: '理解目标、成功标准与边界', ms: 1100, p: 8 });
      steps.push({ phase: 'inspect', text: '派 2 个 Explorer 只读探查相关代码', ms: 1600, p: 22 });
    }
    steps.push({ phase: 'act', text: `修改 ${tpl.files.length} 个文件：${tpl.files.slice(0, 2).join('、')}${tpl.files.length > 2 ? ' 等' : ''}`, ms: 2000, p: 48 });
    if (tpl.needsPermission) steps.push({ phase: 'act', text: '需要运行 pnpm test', gate: true, ms: 400, p: 58 });
    steps.push({ phase: 'act', text: tpl.needsPermission ? '运行 pnpm test：全部通过' : '运行相关检查：通过', ms: 1400, p: 72 });
    steps.push({ phase: 'verify', text: '验证闸门：叶子任务证据齐全', ms: 1000, p: 84 });
    steps.push({ phase: 'verify', text: tpl.visual ? '独立 Verifier 复核 · 视觉验证截图对比' : '独立 Verifier 复核', ms: 1500, p: 95 });
    return steps;
  }

  function spawnSession(tpl, anchorId, extra = {}) {
    const s = {
      id: nid('S'), tpl, title: tpl.title, anchor: anchorId,
      status: 'running', phase: 'orient', progress: 2,
      steps: buildSteps(tpl), stepIndex: 0, log: [], timers: new Set(),
      amendments: [], acceptedBy: null, supersededBy: null, supersedes: null,
      needs: null, verdict: null, merged: false, ...extra,
    };
    s.log.push({ t: `项目代理开出任务，锚定消息「${shorten(M(anchorId)?.text || '', 22)}」`, k: 'a' });
    state.sessions.push(s);
    later(500, () => advance(s), s);
    return s;
  }

  function advance(s) {
    if (s.status !== 'running') return;
    const step = s.steps[s.stepIndex];
    if (!step) return finishSession(s);
    s.phase = step.phase;
    s.progress = step.p;
    if (step.gate) {
      if (!state.granted) {
        s.log.push({ t: '需要运行 pnpm test，等待授权' });
        s.status = 'needs_user';
        s.needs = { resolved: false, result: null };
        render();
        agentWake(s, 'needs');
        return;
      }
      s.log.push({ t: 'pnpm test 在本项目已允许过，直接运行' });
      s.stepIndex++;
      render();
      later(300, () => advance(s), s);
      return;
    }
    s.log.push({ t: step.text });
    render();
    later(step.ms, () => { s.stepIndex++; advance(s); }, s);
  }

  function finishSession(s) {
    s.status = 'verifying';
    s.phase = 'verify';
    s.progress = 100;
    const total = s.tpl.criteria.length + s.amendments.length;
    const partial = s.tpl.verdict === 'partial';
    s.verdict = { outcome: partial ? 'partial' : 'passed', passed: partial ? total - 1 : total, total, unverified: s.tpl.unverified || [] };
    s.decision = (s.tpl.outcome === 'confirm' || partial) ? 'confirm' : 'auto';
    s.log.push({ t: `运行时算出结论：${partial ? '部分验证' : '已验证'} ${s.verdict.passed}/${total} · 签收策略 ${s.decision === 'auto' ? 'auto（低风险）' : 'confirm'}` });
    render();
    agentWake(s, 'verified');
  }

  function resolveNeeds(sid, allow) {
    const s = S(sid);
    if (!s || !s.needs || s.needs.resolved) return;
    s.needs.resolved = true;
    s.needs.result = allow ? 'allowed' : 'denied';
    if (s.status !== 'needs_user') {
      if (allow) state.granted = true;
      render();
      toast(allow ? '已允许 pnpm test（原任务已不在等待，授权留给本项目后续任务）' : '已拒绝');
      return;
    }
    if (allow) {
      state.granted = true;
      const waiting = state.sessions.filter((x) => x.status === 'needs_user' && x.needs && (!x.needs.resolved || x === s));
      for (const w of waiting) {
        w.needs.resolved = true;
        w.needs.result = 'allowed';
        w.log.push({ t: w === s ? '你允许了 pnpm test（同一条请求，在任务里和代理对话里同步）' : '本项目已允许 pnpm test，继续', k: 'u' });
        w.status = 'running';
        w.stepIndex++;
        later(300, () => advance(w), w);
      }
      render();
      toast('已允许 · 本项目后续任务不再重复询问 pnpm test');
    } else {
      s.log.push({ t: '你拒绝了 pnpm test', k: 'u' });
      s.status = 'running';
      s.steps.splice(s.stepIndex + 1, 1, { phase: 'act', text: '跳过测试，改用类型检查', ms: 1200, p: 72 });
      s.tpl = { ...s.tpl, verdict: 'partial', outcome: 'confirm', unverified: ['单测未运行（你拒绝了 pnpm test）'] };
      s.stepIndex++;
      render();
      later(300, () => advance(s), s);
    }
  }

  // ------------------------------------------------------------------
  // Messages
  // ------------------------------------------------------------------
  function addMsg(m) {
    const msg = { id: nid('M'), time: Date.now(), ...m };
    state.messages.push(msg);
    return msg;
  }

  function postReply({ replyTo = [], text, sources = [], verdictOf = null, cards = [], actions = [], detail = null, evidence = null }) {
    addMsg({ role: 'agent', text, replyTo, sources, verdictOf, cards, actions, detail, evidence });
    render(true);
  }

  function agentWake(s, kind) {
    state.busy++;
    render();
    later(1300, () => {
      state.busy--;
      if (kind === 'needs') {
        if (s.status !== 'needs_user') { render(); return; }
        postReply({
          replyTo: [s.anchor],
          text: `要跑一次 pnpm test 验证「${s.title}」，需要你允许。`,
          sources: [s.id],
          cards: [{ type: 'needs', sid: s.id }],
        });
      } else if (kind === 'verified') {
        if (s.status !== 'verifying') { render(); return; }
        const amendNote = s.amendments.length ? `你补充的「${s.amendments.map((a) => shorten(a, 10)).join('、')}」也一起做了。` : '';
        if (s.decision === 'auto') {
          s.status = 'accepted';
          s.acceptedBy = 'policy';
          s.log.push({ t: '代理已汇报 → 运行时过关闭闸门，策略代签（acceptedBy: policy）', k: 'a' });
          postReply({
            replyTo: [s.anchor],
            text: s.tpl.summary + amendNote,
            sources: [s.id],
            verdictOf: s.id,
            actions: s.tpl.branch ? [{ type: 'merge', sid: s.id }] : [],
          });
        } else {
          s.status = 'result_ready';
          s.log.push({ t: '需要你确认，任务停在 result_ready', k: 'a' });
          const gap = s.verdict.unverified.length ? `没验证的：${s.verdict.unverified.join('；')}。` : '';
          postReply({
            replyTo: [s.anchor],
            text: s.tpl.summary + (gap ? '\n' + gap : '') + amendNote,
            sources: [s.id],
            verdictOf: s.id,
            cards: [{ type: 'confirm', sid: s.id }],
          });
        }
      }
      render();
    });
  }

  // ------------------------------------------------------------------
  // Triage (the "agent")
  // ------------------------------------------------------------------
  const ACTIVE = ['running', 'needs_user', 'verifying'];

  function scopeFor(quoteId) {
    if (!quoteId) return null;
    const q = M(quoteId);
    if (!q) return null;
    let ids = [];
    if (q.role === 'user') ids = state.sessions.filter((s) => s.anchor === q.id).map((s) => s.id);
    else ids = q.sources || [];
    // follow supersede chain
    const out = new Set(ids);
    let grew = true;
    while (grew) {
      grew = false;
      for (const s of state.sessions) {
        if (s.supersedes && out.has(s.supersedes) && !out.has(s.id)) { out.add(s.id); grew = true; }
      }
    }
    return [...out];
  }

  function classify(text) {
    if (/不对|有问题|错了/.test(text)) return 'wrong';
    if (/用量面板/.test(text) && !/算了|不按/.test(text)) return 'usage';
    if (/怎么验证|怎么测|改了哪些|验证了什么|细节/.test(text)) return 'detail';
    if (/证据|截图|测试输出|给我看/.test(text)) return 'evidence';
    if (/先别|停下|停掉|别弄|取消/.test(text)) return 'stop';
    if (/算了|改成|换成|不要按/.test(text)) return 'supersede';
    if (/另外|还有一件|再开/.test(text)) return 'parallel';
    if (/顺便|也加上|补充|再加/.test(text)) return 'amend';
    if (/发布|release/i.test(text)) return 'release';
    if (/用量|按天/.test(text)) return 'usage';
    if (/[?？]$|哪个|是什么|在哪|多少/.test(text)) return 'question';
    return 'task';
  }

  function pickTarget(scope, statuses) {
    const pool = state.sessions.filter((s) => statuses.includes(s.status) && (!scope || scope.includes(s.id)));
    return pool[pool.length - 1] || null;
  }

  function triage(m) {
    const scope = scopeFor(m.quote);
    const intent = classify(m.text);
    const running = pickTarget(scope, ACTIVE);
    const done = pickTarget(scope, ['accepted', 'result_ready']);

    const spawn = (tpl, note, extra) => {
      const s = spawnSession(tpl, m.id, extra);
      m.disp = { type: 'spawn', sid: s.id };
      postReply({ replyTo: [m.id], text: note || `在做了。完成标准：${tpl.criteria.join(' / ')}。`, sources: [s.id] });
      return s;
    };

    switch (intent) {
      case 'amend': {
        const running = pickTarget(scope, ['running', 'needs_user']);
        if (!running) return spawn(TPL.generic(m.text));
        running.amendments.push(m.text.replace(/^顺便/, ''));
        running.log.push({ t: `项目代理并入补充：「${m.text}」`, k: 'a' });
        m.disp = { type: 'amend', sid: running.id };
        postReply({ replyTo: [m.id], text: `目标没变，我把这条并进了「${running.title}」，完成标准加一条。`, sources: [running.id] });
        return;
      }
      case 'supersede': {
        if (!running) return spawn(/模型/.test(m.text) ? TPL.usageModel() : TPL.generic(m.text));
        const old = running;
        const tpl = /模型/.test(m.text) ? TPL.usageModel() : { ...TPL.generic(m.text), inherited: true };
        const s = spawnSession(tpl, m.id, { supersedes: old.id });
        clearOwner(old);
        old.status = 'paused';
        old.supersededBy = s.id;
        old.log.push({ t: `被新任务「${s.title}」取代：暂停，分支保留，可恢复`, k: 'a' });
        m.disp = { type: 'supersede', old: old.id, sid: s.id };
        postReply({
          replyTo: [m.id],
          text: `目标变了，继续按原来的做是浪费。我停了「${old.title}」，改开「${s.title}」，沿用已经搭好的面板结构。想回到原来的做法，点「恢复原任务」。`,
          sources: [s.id, old.id],
        });
        return;
      }
      case 'stop': {
        if (!running) {
          m.disp = { type: 'answer' };
          return postReply({ replyTo: [m.id], text: '现在没有在跑的任务。' });
        }
        clearOwner(running);
        running.status = 'cancelled';
        running.log.push({ t: '按你的要求停止（分支保留）', k: 'a' });
        m.disp = { type: 'stop', sid: running.id };
        return postReply({ replyTo: [m.id], text: `好，「${running.title}」停了，已改的部分留在分支上。`, sources: [running.id] });
      }
      case 'parallel': {
        const tpl = /登录/.test(m.text) ? TPL.loginCopy() : TPL.generic(m.text.replace(/^另外/, ''));
        return spawn(tpl, `这是另一件事，单独开一条并行做。完成标准：${tpl.criteria.join(' / ')}。`);
      }
      case 'detail': {
        const s = done || pickTarget(scope, ['accepted', 'result_ready', 'verifying', 'running']);
        m.disp = { type: 'answer' };
        if (!s) return postReply({ replyTo: [m.id], text: '还没有完成的任务可以讲细节。' });
        const crit = [...s.tpl.criteria, ...s.amendments.map((a) => '补充：' + a)];
        const methods = [...s.tpl.methods, ...s.amendments.map(() => '补充项单测通过')];
        return postReply({
          replyTo: [m.id],
          text: `「${s.title}」的验证：`,
          sources: [s.id],
          detail: { crit, methods, files: s.tpl.files, unverified: s.verdict?.unverified || [] },
        });
      }
      case 'evidence': {
        const s = done || pickTarget(scope, ['accepted', 'result_ready']);
        m.disp = { type: 'answer' };
        if (!s) return postReply({ replyTo: [m.id], text: '还没有可以给你看的证据。' });
        return postReply({ replyTo: [m.id], text: `「${s.title}」的证据：`, sources: [s.id], evidence: { sid: s.id } });
      }
      case 'wrong': {
        const s = done || pickTarget(null, ['accepted']);
        if (!s) return spawn(TPL.generic(m.text));
        s.log.push({ t: `你说「${m.text}」→ 代理开派生任务修正；原签收记录保留并标 reopened`, k: 'u' });
        s.reopened = true;
        const fix = TPL.fix(s.tpl, m.text);
        return spawn(fix, `收到，我开一条修正任务，挂在「${s.title}」下面。原来的签收记录保留。`, { parentOf: s.id });
      }
      case 'release':
        return spawn(TPL.release(), '在准备。发布是对外操作，草稿好了会先给你确认，不会自动发。');
      case 'usage':
        return spawn(TPL.usageDay());
      case 'question': {
        m.disp = { type: 'answer' };
        let a = '这个我读了代码直接回答：';
        if (/图表/.test(m.text)) a = '用的是 recharts 2.12（apps/desktop/renderer/package.json），面板在 UsageStatsPanel.tsx。';
        else if (running) a = `「${running.title}」正在${phaseName(running.phase)}，进度约 ${running.progress}%。这个问题不影响它。`;
        else a = '（Demo）这类问题代理用只读能力直接回答，不开任务。';
        return postReply({ replyTo: [m.id], text: a });
      }
      default:
        return spawn(TPL.generic(m.text));
    }
  }

  function phaseName(p) {
    return { orient: '理解目标', inspect: '探查代码', act: '修改与运行', verify: '验证' }[p] || p;
  }

  function onUserSend(text) {
    text = text.trim();
    if (!text) return;
    const quote = state.quote;
    state.quote = null;
    const m = addMsg({ role: 'user', text, quote });
    if (/发布|release/i.test(text)) state.usedReleaseSuggestion = true;
    state.busy++;
    render(true);
    later(1000, () => {
      state.busy--;
      triage(m);
      render(true);
    });
  }

  // ------------------------------------------------------------------
  // Render helpers
  // ------------------------------------------------------------------
  function statusChip(s, withTitle = true) {
    const t = withTitle ? ` · ${esc(s.title)}` : '';
    switch (s.status) {
      case 'running': return `<span class="chip run"><span class="spin"></span>处理中${t}</span>`;
      case 'verifying': return `<span class="chip run"><span class="spin"></span>验证中${t}</span>`;
      case 'needs_user': return `<span class="chip need"><span class="ico-bang">!</span>需要你${t}</span>`;
      case 'result_ready': return `<span class="chip need"><span class="ico-bang">!</span>需要你确认${t}</span>`;
      case 'accepted': return s.acceptedBy === 'user'
        ? `<span class="chip ok"><span class="ico-square"></span>已签收（你确认）</span>`
        : `<span class="chip ok"><span class="ico-square"></span>已完成 · 已验证</span>`;
      case 'paused': return s.supersededBy
        ? `<span class="chip muted"><span class="ico-ring"></span>已被新消息取代</span>`
        : `<span class="chip muted"><span class="ico-ring"></span>已暂停</span>`;
      case 'cancelled': return `<span class="chip muted"><span class="ico-ring"></span>已停止</span>`;
      default: return '';
    }
  }

  function verdictChip(s, short = false) {
    if (!s || !s.verdict) return '';
    const v = s.verdict;
    if (v.outcome === 'passed') return `<span class="chip ok click" data-open-session="${s.id}"><span class="ico-square"></span>已验证 ${v.passed}/${v.total}</span>`;
    const gap = !short && v.unverified.length ? '：' + esc(v.unverified[0]) : '';
    return `<span class="chip warn click" data-open-session="${s.id}"><span class="ico-half"></span>部分验证 ${v.passed}/${v.total}${gap}</span>`;
  }

  function dispositionHtml(m) {
    const d = m.disp;
    if (!d) return `<span class="chip muted"><span class="spin"></span>代理接住中…</span>`;
    if (d.type === 'answer') return `<span class="chip muted">已回复</span>`;
    if (d.type === 'spawn') { const s = S(d.sid); return s ? statusChip(s) : ''; }
    if (d.type === 'amend') { const s = S(d.sid); return `<span class="chip">已并入「${esc(s.title)}」</span>${statusChip(s, false)}`; }
    if (d.type === 'stop') { const s = S(d.sid); return `<span class="chip muted">已停掉「${esc(s.title)}」</span>`; }
    if (d.type === 'supersede') {
      const old = S(d.old), nw = S(d.sid);
      const suffix = old.status === 'paused' && old.supersededBy
        ? ` · <span class="link" data-restore="${old.id}">恢复原任务</span>`
        : (old.restored ? ' · 原任务已恢复' : '');
      return `<span class="chip">已停掉「${esc(old.title)}」，改开「${esc(nw.title)}」${suffix}</span>${statusChip(nw, false)}`;
    }
    return '';
  }

  function cardHtml(c) {
    const s = S(c.sid);
    if (!s) return '';
    if (c.type === 'needs') {
      if (s.needs?.resolved) {
        return `<div class="card resolved"><div class="ct"><b>运行 pnpm test</b>${s.needs.result === 'allowed' ? '已允许（在任务里或这里批准的是同一条请求）' : '已拒绝'}</div></div>`;
      }
      return `<div class="card"><div class="ct"><b>需要你：运行 pnpm test</b>任务「${esc(s.title)}」要跑测试来验证改动</div>
        <button class="btn primary" data-allow="${s.id}">允许</button><button class="btn" data-deny="${s.id}">拒绝</button></div>`;
    }
    if (c.type === 'confirm') {
      if (s.status === 'accepted') return `<div class="card resolved"><div class="ct"><b>已确认</b>你确认了这项结果（acceptedBy: user）</div></div>`;
      if (s.reopened) return `<div class="card resolved"><div class="ct"><b>已打回</b>代理开了修正任务</div></div>`;
      const why = s.tpl.external ? '对外发布' : '验证没完全过线';
      return `<div class="card"><div class="ct"><b>需要你确认：${why}</b>${s.verdict.unverified.length ? '没验证的：' + esc(s.verdict.unverified.join('；')) : ''}</div>
        <button class="btn primary" data-confirm="${s.id}">确认</button><button class="btn" data-reject="${s.id}">不对</button></div>`;
    }
    return '';
  }

  function actionHtml(a) {
    const s = S(a.sid);
    if (!s || a.type !== 'merge') return '';
    if (s.merged) return `<span class="chip muted"><span class="ico-square"></span>已合入 develop · ${s.mergeSha}</span>`;
    if (s.status !== 'accepted') return '';
    return `<span class="chip click" data-merge="${s.id}">合入 develop</span>`;
  }

  function sourcesHtml(ids) {
    if (!ids || !ids.length) return '';
    return ids.map((id) => { const s = S(id); return s ? `<span class="chip click" data-open-session="${id}">来源：${esc(s.title)}</span>` : ''; }).join('');
  }

  function msgHtml(m) {
    if (m.role === 'system') {
      return `<div class="row agent" id="${m.id}"><div class="who">项目代理</div><div class="bubble">${esc(m.text)}</div></div>`;
    }
    if (m.role === 'user') {
      const q = m.quote ? M(m.quote) : null;
      return `<div class="row user" id="${m.id}">
        <div class="who"><button class="quote-btn" data-quote="${m.id}">引用</button>你</div>
        <div class="bubble">${q ? `<div class="user-quote">引用：${esc(shorten(q.text, 40))}</div>` : ''}${esc(m.text)}</div>
        <div class="under">${dispositionHtml(m)}</div>
      </div>`;
    }
    const target = m.replyTo && m.replyTo[0] ? M(m.replyTo[0]) : null;
    const vs = m.verdictOf ? verdictChip(S(m.verdictOf)) : '';
    let detail = '';
    if (m.detail) {
      const d = m.detail;
      detail = `<ul class="detail-list">${d.crit.map((c, i) => `<li><span class="k">${'①②③④⑤⑥'[i] || '·'}</span><span>${esc(c)} —— ${esc(d.methods[i] || '')}</span></li>`).join('')}</ul>
        <div style="margin-top:6px">改了 ${d.files.length} 个文件，主要在 ${esc(d.files[0])}。${d.unverified.length ? '没验证的：' + esc(d.unverified.join('；')) + '。' : ''}想看证据就说一声。</div>`;
    }
    let ev = '';
    if (m.evidence) {
      const s = S(m.evidence.sid);
      const items = [];
      if (s.tpl.visual) items.push(['shot', '截图 usage-panel.png']);
      items.push(['test', s.tpl.needsPermission ? '测试输出 pnpm test' : '检查输出']);
      items.push(['diff', `diff · ${s.tpl.files.length} 个文件`]);
      items.push(['report', '验证报告']);
      ev = `<div class="under">${items.map(([k, l]) => `<span class="chip click" data-evidence="${k}" data-sid="${s.id}">${esc(l)}</span>`).join('')}</div>`;
    }
    const under = [vs, sourcesHtml(m.sources), ...(m.actions || []).map(actionHtml)].filter(Boolean).join('');
    return `<div class="row agent" id="${m.id}">
      <div class="who">项目代理<button class="quote-btn" data-quote="${m.id}">引用</button></div>
      <div class="bubble">${target ? `<div class="reply-bar" data-jump="${target.id}">回复「${esc(shorten(target.text, 36))}」</div>` : ''}${esc(m.text)}${detail}${ev}${(m.cards || []).map(cardHtml).join('')}</div>
      ${under ? `<div class="under">${under}</div>` : ''}
    </div>`;
  }

  function renderThread(scroll) {
    const el = $('#thread');
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    el.innerHTML = state.messages.map(msgHtml).join('') +
      (state.busy > 0 ? `<div class="typing"><span class="dots"><span></span><span></span><span></span></span>项目代理正在思考…</div>` : '');
    if (scroll || nearBottom) el.scrollTop = el.scrollHeight;
  }

  function renderStatus() {
    const running = state.sessions.filter((s) => ACTIVE.includes(s.status)).length;
    const el = $('#agentStatus');
    if (state.busy > 0) el.innerHTML = `<span class="spin"></span>思考中`;
    else if (running) el.innerHTML = `<span class="spin"></span>推进中 · ${running} 条任务`;
    else el.innerHTML = `<span class="ico-ring"></span>空闲`;
  }

  function renderProjects() {
    const need = state.sessions.filter((s) => ['needs_user', 'result_ready'].includes(s.status)).length;
    const running = state.sessions.filter((s) => ACTIVE.includes(s.status)).length;
    $('#projects').innerHTML = `
      <div class="proj on"><span class="name">Peer-Agent</span>${need ? `<span class="badge">${need}</span>` : ''}
        <span class="meta">${running ? `<span class="spin"></span>推进中 ${running} 条` : '代理空闲'}</span></div>
      <div class="proj" data-other="Peer-Knowledge"><span class="name">Peer-Knowledge</span><span class="badge soft">1</span>
        <span class="meta">1 项需要你确认</span></div>
      <div class="proj" data-other="deepseek-harness"><span class="name">deepseek-harness</span>
        <span class="meta">代理空闲</span></div>`;
  }

  const PHASES = ['orient', 'inspect', 'act', 'verify'];
  function phasesHtml(s) {
    const idx = PHASES.indexOf(s.phase);
    const finished = ['accepted', 'result_ready'].includes(s.status);
    return `<div class="phases">${PHASES.map((p, i) => `<span class="${finished || i < idx ? 'done' : i === idx ? 'on' : ''}">${p}</span>`).join('')}</div>`;
  }

  function sessHtml(s) {
    const dim = ['paused', 'cancelled'].includes(s.status);
    const extra = s.supersedes ? `<span class="sl">取代「${esc(S(s.supersedes).title)}」</span>` : (s.parentOf ? `<span class="sl">修正「${esc(S(s.parentOf).title)}」</span>` : '');
    return `<div class="sess ${dim ? 'dim' : ''}" data-open-session="${s.id}">
      <div class="st">${esc(s.title)}</div>
      <div class="sl">${statusChip(s, false)}${s.verdict ? verdictChip(s, true) : ''}</div>
      ${extra}
      ${ACTIVE.includes(s.status) ? `<div class="bar"><i style="width:${s.progress}%"></i></div>${phasesHtml(s)}` : ''}
    </div>`;
  }

  function renderRail() {
    const rail = $('#rail');
    if (state.selected) {
      const s = S(state.selected);
      if (s) { rail.innerHTML = detailHtml(s); return; }
      state.selected = null;
    }
    const groups = [
      ['需要你', state.sessions.filter((s) => ['needs_user', 'result_ready'].includes(s.status))],
      ['进行中', state.sessions.filter((s) => ['running', 'verifying'].includes(s.status))],
      ['已完成', state.sessions.filter((s) => s.status === 'accepted')],
      ['已停止 · 被取代', state.sessions.filter((s) => ['paused', 'cancelled'].includes(s.status))],
    ];
    const body = state.sessions.length
      ? groups.filter(([, l]) => l.length).map(([g, l]) => `<div class="rail-group">${g}<span class="badge soft">${l.length}</span></div>${l.slice().reverse().map(sessHtml).join('')}`).join('')
      : `<div class="empty-rail">还没有任务。<br/>你对代理说要做的事，它会锚定那条消息开任务，这里显示进度和验证结论。</div>`;
    rail.innerHTML = `<div class="rail-head"><span class="t">本项目的任务</span><span class="badge soft">${state.sessions.length}</span></div><div class="rail-body">${body}</div>`;
  }

  function detailHtml(s) {
    const anchor = M(s.anchor);
    const crit = [...s.tpl.criteria, ...s.amendments.map((a) => '补充：' + a)];
    const passedN = s.verdict ? s.verdict.passed : 0;
    const critHtml = crit.map((c, i) => {
      const ok = s.verdict && i < passedN;
      return `<div class="crit ${ok ? 'ok' : ''}"><span class="m">${ok ? '■' : '□'}</span><span>${esc(c)}</span></div>`;
    }).join('');
    const canIntervene = ACTIVE.includes(s.status) || s.status === 'needs_user';
    const needs = s.status === 'needs_user' && s.needs && !s.needs.resolved
      ? `<div class="card"><div class="ct"><b>需要你：运行 pnpm test</b>和代理对话里是同一条请求</div><button class="btn primary" data-allow="${s.id}">允许</button></div>` : '';
    return `<div class="rail-head"><span class="t">任务现场</span></div>
      <div class="rail-body"><div class="detail">
        <button class="back" data-back="1">← 返回任务清单</button>
        <h3>${esc(s.title)}</h3>
        <div class="under" style="flex-wrap:wrap">${statusChip(s, false)}${verdictChip(s, true)}</div>
        ${s.verdict && s.verdict.unverified.length ? `<div style="font-size:12px;color:var(--state-warn);margin-top:6px">没验证的：${esc(s.verdict.unverified.join('；'))}</div>` : ''}
        ${anchor ? `<div class="anchor">锚定：「${esc(shorten(anchor.text, 40))}」</div>` : ''}
        ${ACTIVE.includes(s.status) ? `<div class="bar"><i style="width:${s.progress}%"></i></div>${phasesHtml(s)}` : ''}
        ${needs}
        <div class="sec">成功标准</div>${critHtml}
        ${s.tpl.branch ? `<div class="sec">分支</div><div style="font-size:12px;color:var(--graphite-soft);font-family:var(--font-mono)">${esc(s.tpl.branch)} · from develop</div>` : ''}
        <div class="sec">过程</div>
        <div class="log">${s.log.map((l) => `<div class="${l.k || ''}">${esc(l.t)}</div>`).join('')}</div>
        ${canIntervene ? `<div class="sec">直接介入</div><div class="intervene"><input id="intervene" placeholder="对这条任务直接说…" /><button class="btn" data-intervene="${s.id}">发送</button></div>` : ''}
      </div></div>`;
  }

  function renderSuggest() {
    const hasActiveUsage = state.sessions.some((s) => ACTIVE.includes(s.status) && /用量/.test(s.title));
    const hasDone = state.sessions.some((s) => s.status === 'accepted');
    const hasAny = state.sessions.length > 0;
    let items = [];
    if (!hasAny) items = ['把设置页的用量面板改成按天分组', '现在用的是哪个图表库？'];
    if (hasActiveUsage) items = ['顺便把周视图也加上', '算了，不按天，改成按模型分组', '另外把登录页的文案也改一下', '先别弄了'];
    else if (hasDone) items = ['怎么验证的？', '给我看看证据', '不对，跨月的时候分组错了'];
    if (!state.usedReleaseSuggestion && hasAny) items.push('把 release notes 发到 GitHub Release');
    if (!hasAny) items.push('把 release notes 发到 GitHub Release');
    $('#suggest').innerHTML = `<span class="lbl">试试</span>` + items.map((t) => `<button class="sg" data-say="${esc(t)}">${esc(t)}</button>`).join('');
  }

  function renderQuote() {
    const q = state.quote ? M(state.quote) : null;
    $('#quoteSlot').innerHTML = q ? `<div class="quote-chip">引用：${esc(shorten(q.text, 48))}<button class="x" data-unquote="1">×</button></div>` : '';
  }

  function render(scroll) {
    renderThread(scroll);
    renderStatus();
    renderProjects();
    renderRail();
    renderSuggest();
    renderQuote();
  }

  // ------------------------------------------------------------------
  // Modal
  // ------------------------------------------------------------------
  function openEvidence(kind, sid) {
    const s = S(sid);
    let title = '', body = '';
    if (kind === 'shot') {
      title = '截图 · usage-panel.png（视觉验证）';
      const h = [42, 68, 55, 90, 74, 38, 61];
      const day = /模型/.test(s.title) ? ['GPT-6', 'Opus', 'Sonnet', 'Gemini', 'DeepSeek', 'Qwen', 'GLM'] : ['09-18', '09-19', '09-20', '09-21', '09-22', '09-23', '09-24'];
      body = `<div class="shot"><div class="h"><span>用量 · ${/模型/.test(s.title) ? '按模型' : '按天'}</span><span style="font-weight:400;color:var(--graphite-fade);font-size:11.5px">本地时区 UTC+8</span></div>
        <div class="days">${h.map((v) => `<div style="height:${v}%"></div>`).join('')}</div>
        <div class="lbls">${day.map((d) => `<span>${d}</span>`).join('')}</div>
        <div class="cap">视觉验证：与预期布局对比，差异 0 处（模拟）</div></div>`;
    } else if (kind === 'test') {
      title = s.tpl.needsPermission ? '测试输出 · pnpm test' : '检查输出';
      body = `<pre class="term">$ pnpm --filter @peer-agent/desktop test -- ${esc(s.tpl.files.find((f) => /test/.test(f)) || 'related')}

 ✔ groups usage by local date (4ms)
 ✔ splits at local midnight for UTC+8 (2ms)
 ✔ splits at local midnight for UTC-5 (2ms)
 ✔ keeps totals equal before and after grouping (1ms)
 ✔ renders empty days as zero bars (3ms)
 …
 ℹ tests 12  ℹ pass 12  ℹ fail 0
 ℹ duration_ms 418

$ pnpm typecheck
 ✔ no errors</pre>`;
    } else if (kind === 'diff') {
      title = `diff · ${s.tpl.files.length} 个文件`;
      body = `<div class="diff">
        <div class="f">apps/desktop/renderer/src/settings/${esc(s.tpl.files[0])}</div>
        <div>   const rows = useUsageRows(range);</div>
        <div class="del">-  return &lt;UsageList rows={rows} /&gt;;</div>
        <div class="add">+  const groups = ${/模型/.test(s.title) ? 'groupUsageByModel(rows, catalog)' : 'groupUsageByLocalDay(rows, tz)'};</div>
        <div class="add">+  return &lt;UsageGroupedChart groups={groups} /&gt;;</div>
        <div class="f">${esc(s.tpl.files[1] || '')}</div>
        <div class="add">+export function ${/模型/.test(s.title) ? 'groupUsageByModel(rows, catalog)' : 'groupUsageByLocalDay(rows, tz)'} {</div>
        <div class="add">+  // …（模拟）</div>
        <div class="add">+}</div>
      </div>`;
    } else if (kind === 'report') {
      title = '验证报告（复用已有的自动验收报告）';
      const crit = [...s.tpl.criteria, ...s.amendments.map((a) => '补充：' + a)];
      body = `<div class="report"><table>
        <tr><th>成功标准</th><th>验证方式</th><th>结果</th></tr>
        ${crit.map((c, i) => `<tr><td>${esc(c)}</td><td>${esc(s.tpl.methods[i] || '补充项单测')}</td><td>${s.verdict && i < s.verdict.passed ? '通过' : '未验证'}</td></tr>`).join('')}
      </table>
      <p style="font-size:12px;color:var(--graphite-fade);margin-top:12px">签收：${s.acceptedBy === 'policy' ? '策略代签（结论通过 · 副作用只在任务分支 · 无外部操作）' : s.acceptedBy === 'user' ? '你确认' : '尚未签收'}</p></div>`;
    }
    $('#sheet').innerHTML = `<div class="sheet-head">${esc(title)}<button class="btn ghost x" data-close="1">关闭</button></div><div class="sheet-body">${body}</div>`;
    $('#modal').classList.add('on');
  }

  function toast(t) {
    const el = $('#toast');
    el.textContent = t;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('on'), 2200);
  }

  // ------------------------------------------------------------------
  // Events
  // ------------------------------------------------------------------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-say],[data-quote],[data-unquote],[data-allow],[data-deny],[data-confirm],[data-reject],[data-merge],[data-open-session],[data-back],[data-restore],[data-evidence],[data-close],[data-jump],[data-intervene],[data-other]');
    if (!t) { if (e.target.id === 'modal') $('#modal').classList.remove('on'); return; }
    const d = t.dataset;
    if (d.say) { onUserSend(d.say); return; }
    if (d.quote) { state.quote = d.quote; renderQuote(); $('#input').focus(); return; }
    if (d.unquote) { state.quote = null; renderQuote(); return; }
    if (d.allow) { resolveNeeds(d.allow, true); return; }
    if (d.deny) { resolveNeeds(d.deny, false); return; }
    if (d.confirm) {
      const s = S(d.confirm);
      s.status = 'accepted'; s.acceptedBy = 'user';
      s.log.push({ t: '你确认了结果（acceptedBy: user）', k: 'u' });
      render(); toast('已确认 · 签收记录 acceptedBy: user'); return;
    }
    if (d.reject) {
      const s = S(d.reject);
      const m = addMsg({ role: 'user', text: '不对，先别发，发布页的截图要补上' });
      s.reopened = true; s.status = 'cancelled';
      s.log.push({ t: '你打回了结果', k: 'u' });
      render(true);
      state.busy++;
      later(900, () => { state.busy--; const fix = TPL.fix(s.tpl, '补上发布页截图'); fix.outcome = 'confirm'; fix.external = true; fix.verdict = null;
        const ns = spawnSession(fix, m.id, { parentOf: s.id }); m.disp = { type: 'spawn', sid: ns.id };
        postReply({ replyTo: [m.id], text: '收到，先不发。我开一条修正任务补发布页截图，好了再给你确认。', sources: [ns.id] }); render(true); });
      return;
    }
    if (d.merge) {
      const s = S(d.merge);
      s.merged = true; s.mergeSha = Math.random().toString(16).slice(2, 9);
      s.log.push({ t: `合入 develop · ${s.mergeSha}`, k: 'u' });
      render(); toast('已合入 develop（推送远端仍需另行授权）'); return;
    }
    if (d.openSession) { state.selected = d.openSession; renderRail(); return; }
    if (d.back) { state.selected = null; renderRail(); return; }
    if (d.restore) {
      const old = S(d.restore);
      old.status = 'running'; old.restored = true; old.supersededBy = null;
      old.log.push({ t: '你恢复了原任务，从暂停处继续', k: 'u' });
      render(); later(300, () => advance(old), old); toast('原任务已恢复；新任务不受影响'); return;
    }
    if (d.evidence) { openEvidence(d.evidence, d.sid); return; }
    if (d.close) { $('#modal').classList.remove('on'); return; }
    if (d.jump) { const el = document.getElementById(d.jump); if (el) { el.scrollIntoView({ block: 'center' }); el.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 600 }); } return; }
    if (d.intervene) {
      const input = $('#intervene');
      const v = input && input.value.trim();
      if (!v) return;
      const s = S(d.intervene);
      s.log.push({ t: `你（直接介入）：${v}`, k: 'u' });
      s.log.push({ t: '任务在下一轮开始时采纳；项目代理下次回合可见，不会覆盖你的指令', k: 'a' });
      renderRail(); toast('已发给任务（user_intervened）'); return;
    }
    if (d.other) { toast(`Demo 只演示 Peer-Agent；${d.other} 的代理在自己的对话里`); return; }
  });

  $('#send').addEventListener('click', () => { const v = $('#input').value; $('#input').value = ''; onUserSend(v); });
  $('#input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const v = e.target.value; e.target.value = ''; onUserSend(v); }
  });
  $('#speed').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.speed = Number(b.dataset.v);
    for (const x of $('#speed').children) x.classList.toggle('on', x === b);
  });
  $('#reset').addEventListener('click', reset);

  function reset() {
    for (const id of state.timers) clearTimeout(id);
    state.timers.clear();
    Object.assign(state, { messages: [], sessions: [], busy: 0, quote: null, granted: false, selected: null, usedReleaseSuggestion: false });
    addMsg({ role: 'system', text: '我是 Peer-Agent 的项目代理。你说要做什么，我来开任务、盯进度，验证好了再用一两句话告诉你结论；想看细节随时问。任务跑着的时候你可以随时插话。' });
    render(true);
  }

  reset();
})();
</script>
</body>
</html>
