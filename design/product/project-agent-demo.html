        return reply(`这个任务要做视觉复核，但本项目只允许本地模型，而本地没有能看图的模型。我不会悄悄换别的模型。`, { cards: [{ type: 'vision', tplKey: tpl.title, vt, mid: m.id }], pendingTpl: tpl, pendingNote: note });
      }
      const s = spawnSession(p, tpl, m.id, { ...extra, sel, pref: mp.pref });
      m.disp = { type: 'spawn', sid: s.id };
      const modelNote = mp.pref ? `按你说的，这次用 ${MD(mp.pref).name} 执行；` : '';
      reply(`${modelNote}${note || `在做了。完成标准：${tpl.criteria.join(' / ')}。`}`, { sources: [s.id], memUsed: s.memUsed });
      return s;
    };

    switch (intent) {
      case 'dial_low': case 'dial_high':
        setDial(intent === 'dial_low' ? 'low' : 'high');
        return answer(intent === 'dial_low' ? '好，主动性调到「少」：我自己发现的事除非紧急都攒进今日小结；需要你批准或确认的照常马上找你。' : '好，主动性调到「多」：我发现的新情况会更及时地告诉你。');
      case 'model_policy': {
        const c = CATALOG.find((x) => x.key.test(m.text) && G.models.includes(x.id));
        if (!c) return answer('你说的模型还没接入，可以在设置 → 模型里添加。');
        G.roles.verifier = `model:${c.id}`;
        return answer(`好，以后独立复核固定用 ${c.name}。设置 → 模型分工里能看到和撤销。`);
      }
      case 'scope_local':
        p.modelScope = 'local'; p.visionException = false;
        return answer(`好，${p.name} 以后只用本地模型（所有角色，包括后台探测和记忆提取）。本地模型做不了的事我会先告诉你，不会悄悄换。`);
      case 'autonomy_act': {
        const o = p.objectives[p.objectives.length - 1];
        if (!o) return answer('现在没有在盯的目标。');
        o.autonomy = 'act';
        return answer(`好，「${o.title}」改为发现问题直接动手，修完告诉你。开出的任务照样过验证和签收。`, { objective: o.id });
      }
      case 'explain': {
        const s = [...p.sessions].reverse().find((x) => !x.tpl.bootstrap);
        if (!s) return answer('还没有做过决定可以解释。');
        const mems = s.memUsed.map((id) => memById(p, id)).filter(Boolean);
        return answer(`「${s.title}」我依据了这些：\n${mems.length ? mems.map((x, i) => `${i + 1}. 记忆：${x.s}（${TRUST[x.trust]}${x.source !== '你说的' ? ' · 来源 ' + x.source : ''}）`).join('\n') : '（没有用到记忆）'}\n执行模型 ${mname(s.sel.worker?.id)}（${s.sel.worker?.src}），复核模型 ${mname(s.sel.verifier)}${s.sel.same ? '（同源：没有第二家可用）' : '（不同源）'}。`, { sources: [s.id] });
      }
      case 'forget': {
        const kw = m.text.replace(/^忘掉|^忘了/, '').replace(/[「」"'。]/g, '').trim();
        const all = [...p.memory, ...G.userPrefs].filter((x) => x.status === 'active');
        const hit = all.find((x) => kw && (x.s.includes(kw) || kw.split(/\s+/).some((w) => w.length > 1 && x.s.includes(w))));
        if (!hit) return answer('没找到对应的记忆。可以在右栏「记忆」里直接撤销。');
        hit.status = 'revoked';
        return answer(`好，忘掉了：「${hit.s}」。右栏「记忆」→ 已撤销里可以恢复。`);
      }
      case 'remember': {
        const body = m.text.replace(/^记住[：:，,]?/, '').trim();
        if (/不用确认|自动发布|跳过验证|不用问我/.test(body)) return answer('这类事不能靠记忆放宽：记忆只能让确认和权限更严，不能更松。想改的话在设置里调，我不会自己改。');
        const isPref = /汇报|回复|说话|结论|让我.*看|先问我|中文|英文|简短/.test(body);
        const k = addMem(isPref ? G.userPrefs : p.memory, { kind: isPref ? 'preference' : 'convention', s: body, trust: 'stated', source: '你说的', tags: ['test', 'ui', 'docs', 'release'] });
        const tighten = /让我.*看|先问我|确认/.test(body) ? '\n这条只会让确认更严：对外操作本来就会先问你，以后同类的内部改动也会先给你过目。' : '';
        return answer(`记住了：${body}${isPref ? '（你的偏好，跨项目生效）' : `（${p.name} 的约定）`}${tighten}`, { learned: [k.id] });
      }
      case 'objective': {
        const o = { id: nid('G'), title: '0.0.18 发版前清掉已知 bug', origin: m.id, outcome: '已知 bug 修复并验证；CI 全绿；可以打 tag', milestones: [{ t: '修复已知 bug #1–#3', sid: null }, { t: 'CI 全绿', sid: null }, { t: '打 tag 发版（对外，需你确认）', sid: null }], watches: ['CI 状态 · 每 30 分钟只读探测', 'develop 有新提交 · 事件'], autonomy: 'propose', lastObs: null, lastKey: null };
        p.objectives.push(o);
        const s = spawn(TPL.bugs(), `立了目标「${o.title}」，先开一条任务修已知的三个 bug。之后我每 30 分钟只读检查一次 CI，develop 有新提交也会看。发现问题先告诉你、提出下一步，你点「开始」我再动手。`, { objectiveId: o.id });
        if (s && s.pid) o.milestones[0].sid = s.id;
        p.railTab = 'objectives';
        return;
      }
      case 'amend': {
        const r = pick(p, scope, ['running', 'needs_user']);
        if (!r) return spawn(TPL.generic(mp.text));
        r.amendments.push(mp.text.replace(/^顺便/, '')); r.log.push({ t: `并入补充：「${mp.text}」`, k: 'a' });
        m.disp = { type: 'amend', sid: r.id };
        return reply(`目标没变，我把这条并进了「${r.title}」，完成标准加一条。`, { sources: [r.id] });
      }
      case 'supersede': {
        if (!running) return spawn(/模型/.test(mp.text) ? TPL.usageModel() : TPL.generic(mp.text));
        const old = running;
        const tpl = /模型/.test(mp.text) ? TPL.usageModel() : { ...TPL.generic(mp.text), inherited: true };
        const s = spawnSession(p, tpl, m.id, { supersedes: old.id, pref: mp.pref });
        clearOwner(old); old.status = 'paused'; old.supersededBy = s.id;
        old.log.push({ t: `被「${s.title}」取代：暂停，分支保留，可恢复`, k: 'a' });
        m.disp = { type: 'supersede', old: old.id, sid: s.id };
        return reply(`目标变了，继续按原来的做是浪费。我停了「${old.title}」，改开「${s.title}」，沿用已经搭好的结构。想回到原来的做法，点「恢复原任务」。`, { sources: [s.id, old.id], memUsed: s.memUsed });
      }
      case 'stop':
        if (!running) return answer('现在没有在跑的任务。');
        clearOwner(running); running.status = 'cancelled'; running.log.push({ t: '按你的要求停止（分支保留）', k: 'a' });
        m.disp = { type: 'stop', sid: running.id };
        return reply(`好，「${running.title}」停了，已改的部分留在分支上。`, { sources: [running.id] });
      case 'parallel': {
        const tpl = /登录/.test(mp.text) ? TPL.loginCopy() : TPL.generic(mp.text.replace(/^另外/, ''));
        return spawn(tpl, `这是另一件事，单独开一条并行做。完成标准：${tpl.criteria.join(' / ')}。`);
      }
      case 'detail': {
        const s = done || pick(p, scope, ['accepted', 'result_ready', 'verifying', 'running']);
        if (!s) return answer('还没有完成的任务可以讲细节。');
        G.detailAsks++;
        const crit = [...s.tpl.criteria, ...s.amendments.map((a) => '补充：' + a)];
        const methods = [...s.tpl.methods, ...s.amendments.map(() => '补充项单测通过')];
        answer(`「${s.title}」的验证：`, { sources: [s.id], detail: { crit, methods, files: s.tpl.files, unverified: s.verdict?.unverified || [], sel: s.sel } });
        if (G.detailAsks === 3 && G.learnPrefs && !prefActive(/验证方式/)) {
          const k = addMem(G.userPrefs, { kind: 'preference', s: '汇报时默认附一行验证方式', trust: 'inferred', source: '你连续 3 次问验证细节' });
          post(p, { text: '我注意到你连续几次都问验证细节，以后汇报默认附一行验证方式。不需要的话撤销就行。', learned: [k.id], surf: 'message' });
        }
        return;
      }
      case 'evidence': {
        const s = done || pick(p, scope, ['accepted', 'result_ready']);
        if (!s) return answer('还没有可以给你看的证据。');
        return answer(`「${s.title}」的证据：`, { sources: [s.id], evidence: { sid: s.id } });
      }
      case 'wrong': {
        const s = done || pick(p, null, ['accepted']);
        if (!s) return spawn(TPL.generic(mp.text));
        s.reopened = true; s.log.push({ t: `你说「${m.text}」→ 开派生任务修正，原签收记录保留`, k: 'u' });
        const k = G.memoryOn ? addMem(p.memory, { kind: 'pitfall', s: `「${s.title}」曾漏掉：${shorten(m.text.replace(/^不对[，,]?/, ''), 20)}`, trust: 'stated', source: '你的纠正', tags: s.tpl.tags }) : null;
        for (const id of s.memUsed) { const x = memById(p, id); if (x) x.harmful = (x.harmful || 0) + 1; }
        return spawn(TPL.fix(s.tpl, m.text), `收到，开一条修正任务挂在「${s.title}」下面，原来的签收记录保留。这个坑我记下了。`, { parentOf: s.id, learnedFix: k?.id });
      }
      case 'release': p.usedRelease = true; return spawn(TPL.release(), '在准备。发布是对外操作，草稿好了会先给你确认，不会自动发。');
      case 'usage': return spawn(TPL.usageDay());
      case 'question': {
        if (/图表/.test(mp.text)) return answer('用的是 recharts 2.12（apps/desktop/renderer/package.json），面板在 UsageStatsPanel.tsx。');
        if (/评测集/.test(mp.text)) return answer('目前有 3 个：humaneval-lite、swe-mini、tool-use-basic（evals/ 下，模拟）。');
        if (/能帮我做什么/.test(mp.text) && p.purpose) return answer(`按你给的职责「${shorten(p.purpose, 24)}」，我可以：\n1. 把要做的事拆成任务并推进，资料和产出都放在 ~/Peer/${p.name}/ 里；\n2. 盯着需要持续跟进的事，有变化再告诉你；\n3. 记住你的偏好和做过的决定，下次不用重复交代。`);
        if (running) return answer(`「${running.title}」正在推进，进度约 ${running.progress}%。这个问题不影响它。`);
        return answer('（Demo）这类问题代理用只读能力直接回答，不开任务。');
      }
      default: return spawn(TPL.generic(mp.text));
    }
  }

  function onSend(text) {
    const p = P(); text = text.trim();

    if (!p.bootstrapped) { toast('代理正在熟悉项目，稍等几秒'); return; }
    const quote = p.quote; p.quote = null;

    $('#sidebar').innerHTML = `<div class="bl-top"><div class="brand"><span class="brand-mark">P</span>Peer</div>

  const TRUST = { verified: '已验证', stated: '你说的', inferred: '推断' };
  function statusChip(s, withTitle = true) {
    const t = withTitle ? ` · ${esc(s.title)}` : '';
    switch (s.status) {
      case 'running': return `<span class="chip run"><span class="spin"></span>处理中${t}</span>`;
      case 'verifying': return `<span class="chip run"><span class="spin"></span>验证中${t}</span>`;
      case 'needs_user': return `<span class="chip need"><span class="ico-bang">!</span>需要你${t}</span>`;
      case 'result_ready': return `<span class="chip need"><span class="ico-bang">!</span>需要你确认${t}</span>`;
      case 'accepted': return s.acceptedBy === 'user' ? `<span class="chip ok"><span class="ico-square"></span>已签收（你确认）</span>` : `<span class="chip ok"><span class="ico-square"></span>已完成 · 已验证</span>`;
      case 'paused': return `<span class="chip muted"><span class="ico-ring"></span>${s.supersededBy ? '已被新消息取代' : '已暂停'}</span>`;
      case 'cancelled': return `<span class="chip muted"><span class="ico-ring"></span>已停止</span>`;

  function verdictChip(s, short) {

    return `<span class="chip warn click" data-open-session="${s.id}"><span class="ico-half"></span>部分验证 ${v.passed}/${v.total}${!short && v.unverified.length ? '：' + esc(v.unverified[0]) : ''}</span>`;

  function dispHtml(p, m) {

    if (d.type === 'answer') return `<span class="chip muted">已回复</span>`;

    if (d.type === 'stop') return `<span class="chip muted">已停掉「${esc(S(d.sid).title)}」</span>`;
    if (d.type === 'supersede') {
      const old = S(d.old), nw = S(d.sid);

      return `<span class="chip">已停掉「${esc(old.title)}」，改开「${esc(nw.title)}」${suf}</span>${statusChip(nw, false)}`;

        <div style="margin-top:6px">改了 ${d.files.length} 个文件，主要在 ${esc(d.files[0])}。执行 ${esc(mname(d.sel?.worker?.id))}，复核 ${esc(mname(d.sel?.verifier))}${d.sel?.same ? '（同源）' : '（不同源）'}。${d.unverified.length ? '没验证的：' + esc(d.unverified.join('；')) + '。' : ''}想看证据就说一声。</div>`;

    if (m.memUsed?.length) chips.push(`<span class="chip click" data-mem-list="used" data-mid="${m.id}">参考了 ${m.memUsed.length} 条记忆</span>`);
    if (m.learned?.length) chips.push(`<span class="chip click" data-mem-list="learned" data-mid="${m.id}">新记住 ${m.learned.length} 条</span>`);
    for (const a of m.actions || []) { const s = S(a.sid); if (s && a.type === 'merge') chips.push(s.merged ? `<span class="chip muted">已合入 develop · ${s.mergeSha}</span>` : s.status === 'accepted' ? `<span class="chip click" data-merge="${s.id}">合入 develop</span>` : ''); }
    if (m.surf) chips.push(`<span class="chip muted">送达：${SURF[m.surf]}</span>`);
    return `<div class="row agent" id="${m.id}"><div class="who">${esc(p.displayName)}<button class="quote-btn" data-quote="${m.id}">引用</button></div>

  }
  function suggestions(p) {
    if (!p.bootstrapped) return [];
    const act = p.sessions.some((s) => ACTIVE.includes(s.status) && /用量/.test(s.title));
    const doneAny = p.sessions.some((s) => s.status === 'accepted' && !s.tpl.bootstrap);
    let items = [];
    if (p.awaitPurpose) return ['帮我追踪几家竞品的产品动态，每周整理一次', '帮我整理和维护读书笔记'];
    if (act) items = ['顺便把周视图也加上', '算了，不按天，改成按模型分组', '另外把登录页的文案也改一下', '先别弄了'];
    else if (doneAny) items = p.name === 'Peer-Agent' ? ['怎么验证的？', '给我看看证据', '你为什么这么做？', '不对，跨月的时候分组错了'] : ['怎么验证的？', '你为什么这么做？', ...p.preset.suggestions];
    else items = [...p.preset.suggestions];
    if (p.name === 'Peer-Agent') {
      if (!p.usedRelease && doneAny) items.push('把 release notes 发到 GitHub Release');
      if (!act && !doneAny) items.push('用 GPT 把设置页的用量面板改成按天分组');
      if (doneAny) items.push('记住：发布前一定让我先看一眼');
      if (p.objectives.length && p.objectives.some((o) => o.autonomy !== 'act')) items.push('以后 CI 挂了就直接修');
      if (doneAny && p.modelScope !== 'local') items.push('这个项目只用本地模型');
      if (p.modelScope === 'local') items.unshift('把设置页的用量面板改成按天分组');
      if (doneAny) items.push('以后复核都用 GPT');
    }
    return [...new Set(items)].slice(0, 6);
  }

  }
  function sessHtml(p, s) {

      <div class="sl">${statusChip(s, false)}${verdictChip(s, true)}</div>${extra ? `<div class="sl">${extra}</div>` : ''}
      ${ACTIVE.includes(s.status) ? `<div class="bar"><i style="width:${s.progress}%"></i></div>${phasesHtml(s)}` : ''}</div>`;
  }
  function detailHtml(p, s) {
    const anchor = M(p, s.anchor);
    const crit = [...s.tpl.criteria, ...s.amendments.map((a) => '补充：' + a)];
    const sel = s.sel || {};
    const memHtml = s.memUsed.map((id) => memById(p, id)).filter(Boolean).map((x) => `<div class="crit"><span class="m">·</span><span>${esc(x.s)} <span class="trust ${x.trust}">${TRUST[x.trust]}</span></span></div>`).join('');
    const needs = s.status === 'needs_user' && s.needs && !s.needs.resolved ? `<div class="card"><div class="ct"><b>需要你：运行测试</b>和对话里是同一条请求</div><button class="btn primary" data-allow="${s.id}">允许</button></div>` : '';
    return `<div class="detail"><button class="back" data-back="1">← 返回</button><h3>${esc(s.title)}</h3>
      <div class="under">${statusChip(s, false)}${verdictChip(s, true)}</div>
      ${anchor ? `<div class="anchor">锚定：「${esc(shorten(anchor.text, 40))}」</div>` : ''}
      ${ACTIVE.includes(s.status) ? `<div class="bar"><i style="width:${s.progress}%"></i></div>${phasesHtml(s)}` : ''}${needs}

      <div class="kv"><span>执行</span><b>${esc(mname(sel.worker?.id))} <span class="tag">${esc(sel.worker?.src || '')}</span></b>
        ${s.tpl.bootstrap ? '' : `<span>复核</span><b>${esc(mname(sel.verifier))} <span class="tag">${sel.same ? '同源' : '不同源'}</span></b>
        <span>探查</span><b>${esc(mname(sel.explorer?.id))}</b>

      ${crit.length ? `<div class="sec">成功标准</div>${crit.map((c, i) => `<div class="crit ${s.verdict && i < s.verdict.passed ? 'ok' : ''}"><span class="m">${s.verdict && i < s.verdict.passed ? '■' : '□'}</span><span>${esc(c)}</span></div>`).join('')}` : ''}

      ${ACTIVE.includes(s.status) && !s.tpl.bootstrap ? `<div class="sec">直接介入</div><div class="intervene"><input id="intervene" placeholder="对这条任务直接说…" /><button class="btn" data-intervene="${s.id}">发送</button></div>` : ''}</div>`;

  function objHtml(p, o) {

    if (d.memAct) {
      const list = d.scope === 'u' ? G.userPrefs : p.memory; const x = list.find((k) => k.id === d.kid); if (!x) return;
      if (d.memAct === 'revoke') { x.status = 'revoked'; toast('已撤销，可恢复'); }
      if (d.memAct === 'restore') { x.status = 'active'; toast('已恢复'); }
      if (d.memAct === 'pin') { x.pinned = !x.pinned; }
      render(); if (G.modal) renderModal(); return;
    }
    if (d.jump) { const el = document.getElementById(d.jump); if (el) { el.scrollIntoView({ block: 'center' }); el.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 600 }); } return; }
    if (d.intervene) { const v = $('#intervene')?.value.trim(); if (!v) return; const s = p.sessions.find((x) => x.id === d.intervene); s.log.push({ t: `你（直接介入）：${v}`, k: 'u' }); s.log.push({ t: '下一轮采纳；代理可见，不会覆盖你的指令', k: 'a' }); renderRail(); toast('已发给任务'); return; }
    if (d.railTab) { p.drawerOpen = true; p.railTab = d.railTab; p.selected = null; render(); return; }
    if (d.sim) { simulate(p, d.oid, d.sim); return; }
    if (d.digest) { flushDigest(p); return; }
    if (d.propose) {
      const o = p.objectives.find((x) => x.id === d.oid); if (!o || o.proposalResolved) return;
      o.proposalResolved = d.propose === 'yes' ? 'started' : 'declined';
      if (d.propose === 'yes') { const s = spawnSession(p, TPL.ciFix(), o.origin, { objectiveId: o.id }); o.milestones[1].sid = s.id; post(p, { replyTo: [o.origin], text: '好，开了一条任务修 CI。', sources: [s.id], objective: o.id, memUsed: s.memUsed }); }
      else render();
      return;
    }
    if (d.dial) { setDial(d.dial); render(); if (G.modal) renderModal(); toast(`主动性：${{ off: '关', low: '少', normal: '标准', high: '多' }[d.dial]}（需要你批准 / 确认的事不受影响）`); return; }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'bl-search') { G.search = e.target.value; renderSidebar(); const el = $('#bl-search'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  document.addEventListener('change', (e) => {
    const d = e.target.dataset; const p = P();
    if (e.target.id === 'bot-name' && p) { const v = e.target.value.trim(); if (v) { p.displayName = v; render(); toast('已改名'); } return; }
    if (d.tier) { G.tiers[d.tier] = e.target.value; renderModal(); render(); }
    if (d.role) { G.roles[d.role] = e.target.value; toast('已更新：之后开出的任务按新分工，进行中的任务不变'); }
    if (d.scope && p) { p.modelScope = e.target.value; p.visionException = false; render(); }
    if (d.quiet) G.quietHours = e.target.checked;
    if (d.memOn) { G.memoryOn = e.target.checked; render(); }
    if (d.learn) G.learnPrefs = e.target.checked;
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const v = e.target.value; e.target.value = ''; onSend(v); }
    if (e.target.id === 'blank-name' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); document.querySelector('[data-blank]')?.click(); }
    if (e.key === 'Escape' && G.modal) { G.modal = null; renderModal(); }
    else if (e.key === 'Escape' && P()?.drawerOpen) { P().drawerOpen = false; render(); }
  });
  document.addEventListener('click', (e) => { if (e.target.id === 'send') { const v = $('#input').value; $('#input').value = ''; onSend(v); } });
  $('#speed').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; speed = Number(b.dataset.v); for (const x of $('#speed').children) x.classList.toggle('on', x === b); });
  $('#reset').addEventListener('click', () => reset(false));
  $('#skip').addEventListener('click', () => reset(true));

  function reset(skip) {
    for (const id of timers) clearTimeout(id);
    timers.clear();
    Object.assign(G, freshState());
    if (skip) {
      G.models = ['opus', 'gpt', 'flash', 'qwen']; recommendTiers();
      render();
      addProject('Peer-Knowledge', { activate: false });
      addProject('Peer-Agent');
      toast('已跳过首启：接入 4 个模型并按推荐分配，建好 Peer-Agent 与 Peer-Knowledge 两个机器人');
    } else render();
  }
  reset(false);
})();
</script>
</body>
</html>
